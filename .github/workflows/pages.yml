name: Deploy Chaat Junction POC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror verified production site
        run: |
          mkdir -p _site
          wget --mirror --page-requisites --convert-links --adjust-extension \
            --no-host-directories --directory-prefix=_site \
            https://chaat-junction-uae-concept.quirkly.chatgpt.site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
